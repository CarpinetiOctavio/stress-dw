<text class="mono" x="520.0" y="323.0" text-anchor="start">growing_stress, mood_swings,</text>
<text class="mono" x="520.0" y="336.0" text-anchor="start">coping_struggles, social_weakness</text>
<path class="link" d="M508,304.0 C488,304.0 500,282 480,282"/>
<text x="400.0" y="370.0" text-anchor="middle">Each foreign key of fact_response resolves to one row of its dimension.</text>
</svg>
