<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" width="680" height="278" role="img" aria-labelledby="t d">
<title id="t">Repeated cross-sections against a panel</title>
<desc id="d">Left: three months, each with four different respondents, A to L. Right: the same four people, A to D, observed in each of three months and linked across them.</desc>
<style>
  svg { --ink: #0b0b0b; --ink2: #52514e; --grid: #e4e3df; --band: #f1efe9; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --ink: #f0efec; --ink2: #c3c2b7; --grid: #3a3936; --band: #2a2927; --s1: #3987e5; --s2: #d95926; --s3: #199e70; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink2); }
  .ink { fill: var(--ink); } .h { fill: var(--ink); font-weight: 600; font-size: 14px; }
  .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .axis { stroke: var(--ink2); stroke-width: 1; fill: none; }
  .band { fill: var(--band); }
  .l1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; }
  .l2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); }
  .o1 { fill: none; stroke: var(--s1); stroke-width: 2; }
  .o0 { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
  .dot { fill: var(--ink); }
  .box { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker></defs>
<text class="h" x="170.0" y="26.0" text-anchor="middle">Repeated cross-sections</text>
