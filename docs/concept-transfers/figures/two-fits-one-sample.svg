<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Two fits of one sample</title>
<desc id="d">Twenty-five synthetic annual maxima, fitted by a 2-parameter and a 3-parameter distribution. The two curves agree within the record and separate beyond it.</desc>
