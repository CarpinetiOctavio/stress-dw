# Verification register of published sources: the home of every source entry
# and its claims. The rule it implements, and its reasoning, are in LOG-048
# (docs/decisions/log/LOG-048-verifiable-source-checks.md); how it is checked is
# in docs/references/README.md.
#
# Per source: `first_page` is the printed page number of the first PDF page
# after `leading_pages` (pages before it, such as a provider's cover page;
# default 0); `version` says which version of the work the copy is (default
# "published"); `reproducible_hash` is false when another copy cannot match the
# hash, because the provider stamps each download or the copy is a scan
# (default true); `stored` is true when the copy is kept in docs/references/
# because its licence permits redistribution; `doi` is empty for a work without
# one, such as a book, whose ISBN is then in the citation.
#
# Per claim: `page` is the printed page; `pdf_page` (optional) is the PDF page
# that holds it, for a scan whose offset between printed and PDF pages varies;
# `quote` is a verbatim passage of the copy; `cited_in` lists the documents that
# make the claim, as `path#anchor` (empty until a document cites it).

